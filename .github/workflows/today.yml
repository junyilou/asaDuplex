name: Today at Apple

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 运行模式
        type: choice
        options: [normal, sitemap-personal, sitemap]
        default: normal

concurrency:
  group: today-at-apple
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout repo content
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: resolve mode
        id: mode
        run: |
          case "${{ inputs.mode }}" in
            normal)           args=""       ; msg="auto: Today at Apple" ;;
            sitemap-personal) args="-s 🇯🇵" ; msg="auto: Today at Apple [Sitemap Personal]" ;;
            sitemap)          args="-s"     ; msg="auto: Today at Apple [Sitemap]" ;;
            *)                echo "unknown mode: ${{ inputs.mode }}"; exit 1 ;;
          esac
          { echo "args=$args"; echo "msg=$msg"; } >> "$GITHUB_OUTPUT"
      - name: execute py script
        env:
          BOTPOST_API: ${{ secrets.BOTPOST_API }}
          BOTPOST_CHAT_ID: ${{ secrets.BOTPOST_CHAT_ID }}
        run: uv run --frozen python Today.py -d ${{ steps.mode.outputs.args }}
      - name: commit files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ steps.mode.outputs.msg }}
