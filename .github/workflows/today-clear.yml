name: Today at Apple [Clear]

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout repo content
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: execute py script 1
        run: uv run --frozen python TodayClear.py --assured
      - name: execute py script 2
        run: uv run --frozen python TodayClear.py --saved
      - name: commit files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'auto: Today at Apple [Clear]'